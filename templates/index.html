<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Väderappen</title>
</head>
<body>

    <!-- Rubrik för väderappen -->
    <h1>Väderappen</h1>

    <!-- Formulär där användaren väljer stad -->
    <form action="/väder" method="get">

        <label for="stad">Välj stad:</label>

        <select name="stad" id="stad">
            <option value="Stockholm">Stockholm</option>
            <option value="Göteborg">Göteborg</option>
            <option value="Malmö">Malmö</option>
            <option value="Umeå">Umeå</option>
            <option value="Kiruna">Kiruna</option>
        </select>

        <!-- Skickar den valda staden till väderrouten -->
        <button type="submit">Visa väder</button>

    </form>

</body>
</html>
